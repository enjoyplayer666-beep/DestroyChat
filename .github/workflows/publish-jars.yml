# Запуск вручную или при пуше в рабочую ветку: собирает DestroyChat (с модулями MediaBans и VanishEffects) и MediaClans и кладёт jar в ветку jars (для скачивания через git).
name: publish-jars
on:
  workflow_dispatch:
  push:
    branches: [claude/sharp-brahmagupta-ptif54]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - run: mvn -B -f mediaclans/pom.xml package
      - run: |
          mkdir -p /tmp/out && cp target/*.jar mediaclans/target/MediaClans.jar /tmp/out/ && rm -f /tmp/out/original-*.jar
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan jars && git rm -rfq . && cp /tmp/out/*.jar .
          git add *.jar && git commit -qm "jars from ${GITHUB_SHA}" && git push -f origin jars
