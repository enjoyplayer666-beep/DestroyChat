name: MediaDestroyChat
version: ${project.version}
main: ru.dscraft.destroychat.DestroyChatPlugin
api-version: '1.21'
author: loserwrld
description: Чат Amaterasu + модули MediaBans (наказания) и VanishEffects (ваниш)
softdepend:
- LuckPerms
- MediaDestroyLobby
- MediaClans
- MediaDestroyPvP
- Essentials
- LiteBans
- AdvancedBan
- BanManager
- CMI
commands:
  destroychat:
    description: Перезагрузка конфига чата
    usage: /destroychat reload | /destroychat announce [номер]
    permission: destroychat.admin
  color:
    description: Цвет сообщений в чате
    usage: /color <цвет> | /color reset
  chatprefix:
    description: Отдельный префикс для чата (то же, что /prefix chat)
    usage: /chatprefix <текст> | /chatprefix reset
  dcplayer:
    description: Меню действий над игроком (клик по нику в чате)
    usage: /dcplayer <ник>
  contact:
    description: Контакты команды проекта
    usage: /contact
    aliases:
    - contacts
    - kontakt
    permission: destroychat.contact
  back:
    description: На место последней смерти
    usage: /back
  dback:
    description: На место последней смерти
    usage: /dback
  admin:
    description: Телепорт на варп admin (команда проекта)
    usage: /admin
  espeed:
    description: Скорость полёта и ходьбы (команда проекта)
    usage: /espeed fly|walk 1-10
  spec:
    description: Режим наблюдателя / творческий (команда проекта)
    usage: /spec
  ban:
    description: Забанить навсегда (команда проекта)
    usage: /ban <ник> [причина]
  tempban:
    description: Забанить на время
    usage: /tempban <ник> <время> [причина]
    aliases:
    - tban
  mute:
    description: Замутить навсегда (команда проекта)
    usage: /mute <ник> [причина]
  tempmute:
    description: Замутить на время
    usage: /tempmute <ник> <время> [причина]
    aliases:
    - tmute
  kick:
    description: Кикнуть игрока (команда проекта)
    usage: /kick <ник> [причина]
  unban:
    description: Разбанить
    usage: /unban <ник>
    aliases:
    - pardon
  unmute:
    description: Снять мут
    usage: /unmute <ник>
  checkban:
    description: Информация о бане
    usage: /checkban <ник>
  checkmute:
    description: Информация о муте
    usage: /checkmute <ник>
  banlist:
    description: Список забаненных
    usage: /banlist [страница]
    aliases:
    - bans
  mediabans:
    description: Перезагрузка конфига MediaBans
    usage: /mediabans reload
  v:
    description: Включить/выключить ваниш.
    usage: '/v — включить/выключить ваниш (у групп - их эффектом, у опов - последним выбранным)

      /v <fire|bats|lightning|starfall|frost|soul|ascension> [игрок] — только опы

      /v menu — меню эффектов, только опы

      /v reload — перезагрузить config.yml, только опы

      '
permissions:
  destroychat.admin-warp:
    default: op
  destroychat.espeed:
    default: op
  destroychat.spec:
    default: op
  destroychat.contact:
    default: true
  destroychat.admin:
    default: op
  destroychat.logs:
    description: Видеть [DestroyLog] - команды игроков в чате
    default: op
  destroylobby.prefix.chat:
    default: false
  destroylobby.chat.colors:
    default: false
  destroylobby.chat.color:
    default: false
  destroylobby.chat.spy:
    default: false
  mediabans.staff:
    description: Наказывать без ограничений и не получать наказаний, как команда проекта
    default: false
  vanisheffects.see:
    description: Позволяет видеть игроков в ваниш-режиме.
    default: op
