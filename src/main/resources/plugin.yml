name: DestroyChat
version: '${project.version}'
main: ru.dscraft.destroychat.DestroyChatPlugin
api-version: '1.21'
author: DestroyCraft
description: Чат DestroyCraft, работает в паре с DestroyLobby
softdepend: [LuckPerms, DestroyLobby]

commands:
  destroychat:
    description: Перезагрузка конфига чата
    usage: /destroychat reload | /destroychat announce [номер]
    permission: destroychat.admin
  color:
    description: Цвет сообщений в чате
    usage: /color <цвет> | /color reset
  clan:
    description: Кланы
    usage: /clan
    aliases: [c, clans, кланы]
  chatprefix:
    description: Отдельный префикс для чата (то же, что /prefix chat)
    usage: /chatprefix <текст> | /chatprefix reset

permissions:
  destroychat.clan.admin:
    default: op
  destroychat.admin:
    default: op
  destroylobby.prefix.chat:
    default: false
  destroylobby.chat.colors:
    default: false
  destroylobby.chat.color:
    default: false
  destroylobby.chat.spy:
    default: false
