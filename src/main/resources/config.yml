# =====================================================================
#  DestroyChat - config.yml
#  Формат как на сервере-образце:  Ⓛ ⌜Игрок⌟ ник → сообщение
#  Все тексты - MiniMessage. Значки Ⓛ / Ⓖ берутся из ресурс-пака SP-DS.
#
#  Работает в паре с DestroyLobby: запрет чата в лобби и разделение
#  лобби / SkyPvP настраиваются в DestroyLobby (chat.block-in-lobby, isolation).
# =====================================================================

# радиус локального чата в блоках; 0 - локального чата нет, всё идёт в глобальный
local-radius: 100

# символ глобального чата в начале сообщения
global-symbol: "!"

# право видеть локальный чат на любом расстоянии (модерация)
spy-permission: "destroylobby.chat.spy"

# если рядом никого - подсказка отправителю ("" - не писать)
nobody-heard-message: "<gray>Рядом никого нет. Поставь <white>!</white> перед сообщением, чтобы написать в глобальный чат.</gray>"

format:
  # <icon> - значок канала, <prefix> - префикс, <name> - ник
  layout: "<icon> <prefix><name> <dark_gray>→</dark_gray> "
  # значки из ресурс-пака (белый цвет = родные цвета картинки)
  local-icon: "<white>Ⓛ</white>"
  global-icon: "<white>Ⓖ</white>"
  # ник в чате всегда этого цвета, префикс его не меняет
  name-color: "&7"
  # префикс, если у игрока нет привилегии и личного префикса
  default-prefix: "&f⌜&3Игрок&f⌟ "
  # цвет сообщений по умолчанию (сняты со скрина)
  local-message-color: "<#AFAABF>"
  global-message-color: "<#DBA078>"
  # клик по нику в чате -> /msg ник
  name-click-msg: true

chat-prefix:
  # /prefix chat - максимум видимых символов (без учёта цветов)
  max-length: 24
